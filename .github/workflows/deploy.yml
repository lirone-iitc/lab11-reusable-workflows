    # Syntax: uses: ./.github/workflows/reusable-deploy.yml
    uses: # ← fill this in

    with:
      # TODO: Pass the 'environment' input.
      # Use the string value: staging
      environment: # ← fill this in

    secrets:
      # TODO: Pass the 'deploy-token' secret.
      # The secret is stored in GitHub Settings as DEPLOY_TOKEN.
      # Syntax: ${{ secrets.DEPLOY_TOKEN }}
