name: Deploy

on:
  push:
    branches:
      - main

jobs:
  call-deploy:
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}

  confirm:
    name: Confirm deployment
    runs-on: ubuntu-latest
    needs: call-deploy
    steps:
      - name: Print deploy status
        run: |
          echo "Deploy result: ${{ needs.call-deploy.outputs.deploy-status }}"
